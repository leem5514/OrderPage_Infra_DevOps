# Grafana sidecar가 observability namespace의 이 ConfigMap만 읽는다.
# 화면 수치는 부하를 실제로 가한 뒤 확인하며 개선율을 미리 주장하지 않는다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: orderpage-observability-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  orderpage-observability.json: |
    {
      "uid": "orderpage-devops",
      "title": "OrderPage | API and Kubernetes",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {"from": "now-1h", "to": "now"},
      "panels": [
        {
          "id": 1, "title": "API requests / second", "type": "timeseries",
          "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8},
          "fieldConfig": {"defaults": {"unit": "reqps"}},
          "targets": [{"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"},
            "expr": "sum(rate(http_server_requests_seconds_count{application=\"ordersystem\",uri!~\"/actuator.*\"}[5m]))"}]
        },
        {
          "id": 2, "title": "API 5xx / second", "type": "timeseries",
          "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8},
          "fieldConfig": {"defaults": {"unit": "reqps"}},
          "targets": [{"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"},
            "expr": "sum(rate(http_server_requests_seconds_count{application=\"ordersystem\",status=~\"5..\",uri!~\"/actuator.*\"}[5m]))"}]
        },
        {
          "id": 3, "title": "API p95 latency", "type": "timeseries",
          "gridPos": {"x": 0, "y": 8, "w": 12, "h": 8},
          "fieldConfig": {"defaults": {"unit": "s"}},
          "targets": [{"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"},
            "expr": "histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{application=\"ordersystem\",uri!~\"/actuator.*\"}[5m])))"}]
        },
        {
          "id": 4, "title": "Backend Pod CPU cores", "type": "timeseries",
          "gridPos": {"x": 12, "y": 8, "w": 12, "h": 8},
          "fieldConfig": {"defaults": {"unit": "cores"}},
          "targets": [{"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"},
            "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"orderpage\",container=\"orderpage-backend\"}[5m]))"}]
        },
        {
          "id": 5, "title": "Backend Pod working memory", "type": "timeseries",
          "gridPos": {"x": 0, "y": 16, "w": 12, "h": 8},
          "fieldConfig": {"defaults": {"unit": "bytes"}},
          "targets": [{"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"},
            "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"orderpage\",container=\"orderpage-backend\"})"}]
        },
        {
          "id": 6, "title": "Available backend replicas", "type": "timeseries",
          "gridPos": {"x": 12, "y": 16, "w": 12, "h": 8},
          "fieldConfig": {"defaults": {"unit": "short"}},
          "targets": [{"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"},
            "expr": "kube_deployment_status_replicas_available{namespace=\"orderpage\",deployment=\"orderpage-backend\"}"}]
        }
      ]
    }
