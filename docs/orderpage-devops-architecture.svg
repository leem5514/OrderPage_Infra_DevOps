<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">OrderPage DevOps Architecture</title>
  <desc id="desc">OrderPage service architecture showing Vercel frontend, Jenkins CI/CD, Terraform-managed AWS infrastructure, EKS backend, managed data services, and observability.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 30px "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 14px "Segoe UI", Arial, sans-serif; fill: #64748b; }
      .section-title { font: 700 18px "Segoe UI", Arial, sans-serif; fill: #334155; }
      .label { font: 600 15px "Segoe UI", Arial, sans-serif; fill: #334155; }
      .small { font: 500 12px "Segoe UI", Arial, sans-serif; fill: #64748b; }
      .tiny { font: 500 11px "Segoe UI", Arial, sans-serif; fill: #64748b; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; rx: 10; }
      .soft { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1.2; rx: 14; }
      .aws { fill: #fff7ed; stroke: #fb923c; stroke-width: 2; rx: 18; }
      .vpc { fill: #eef6ff; stroke: #60a5fa; stroke-width: 1.6; rx: 16; }
      .eks { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.4; rx: 12; }
      .subnet-public { fill: #ecfdf5; stroke: #34d399; stroke-width: 1.2; rx: 12; }
      .subnet-private { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1.2; rx: 12; }
      .service-panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; rx: 12; }
      .obs { fill: #f5f3ff; stroke: #a78bfa; stroke-width: 1.4; rx: 12; }
      .iac { fill: #ecfeff; stroke: #22d3ee; stroke-width: 1.4; rx: 12; }
      .node { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; rx: 8; }
      .icon-aws { fill: #ff9900; }
      .icon-blue { fill: #2563eb; }
      .icon-green { fill: #16a34a; }
      .icon-purple { fill: #7c3aed; }
      .icon-pink { fill: #db2777; }
      .icon-gray { fill: #475569; }
      .icon-dark { fill: #0f172a; }
      .line { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .line-soft { fill: none; stroke: #94a3b8; stroke-width: 1.6; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .line-green { fill: none; stroke: #059669; stroke-width: 2.2; marker-end: url(#arrow-green); }
      .badge { fill: #e2e8f0; rx: 12; }
      .badge-text { font: 600 11px "Segoe UI", Arial, sans-serif; fill: #475569; }
      .metric { font: 700 12px "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .mono { font: 600 11px Consolas, "Courier New", monospace; fill: #475569; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="980"/>

  <text x="52" y="54" class="title">OrderPage DevOps Architecture</text>
  <text x="54" y="82" class="subtitle">Frontend는 Vercel, Backend는 AWS EKS, 인프라는 Terraform/Jenkins로 자동화하는 포트폴리오 목표 아키텍처</text>

  <g id="legend" transform="translate(1180 36)">
    <rect class="box" x="0" y="0" width="368" height="58"/>
    <circle cx="22" cy="20" r="6" fill="#64748b"/>
    <text x="38" y="24" class="tiny">사용자 트래픽</text>
    <circle cx="136" cy="20" r="6" fill="#059669"/>
    <text x="152" y="24" class="tiny">CI/CD 배포 흐름</text>
    <line x1="246" y1="20" x2="286" y2="20" class="line-soft"/>
    <text x="294" y="24" class="tiny">관측/상태 연결</text>
    <text x="20" y="45" class="tiny">주요 수치: HPA 2-5 pods, CPU 70%, Memory 80%, ECR 30 images</text>
  </g>

  <g id="frontend-flow">
    <text x="54" y="128" class="section-title">User &amp; Frontend</text>
    <rect class="soft" x="44" y="150" width="330" height="250"/>

    <g transform="translate(74 208)">
      <circle cx="35" cy="24" r="20" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
      <path d="M35 48 C14 48 4 61 4 82 L66 82 C66 61 56 48 35 48 Z" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
      <text x="0" y="116" class="label">User Browser</text>
      <text x="0" y="136" class="small">Web / Mobile</text>
    </g>

    <g transform="translate(238 185)">
      <rect class="node" x="0" y="0" width="106" height="88"/>
      <rect x="22" y="12" width="62" height="44" rx="8" fill="#111827"/>
      <path d="M53 20 L76 58 H30 Z" fill="#ffffff"/>
      <text x="29" y="116" class="label">Vercel</text>
      <text x="7" y="136" class="small">FE deploy</text>
    </g>

    <g transform="translate(238 315)">
      <rect class="node" x="0" y="0" width="106" height="58"/>
      <circle cx="34" cy="29" r="18" fill="#7c3aed"/>
      <text x="25" y="34" fill="#ffffff" font-size="14" font-weight="700">DNS</text>
      <text x="62" y="28" class="small">Custom</text>
      <text x="62" y="44" class="small">Domain</text>
    </g>

    <path class="line" d="M154 276 C184 276 194 230 238 230"/>
    <path class="line" d="M154 286 C184 286 194 344 238 344"/>
  </g>

  <g id="aws-cloud">
    <rect class="aws" x="410" y="126" width="810" height="650"/>
    <rect x="410" y="126" width="810" height="45" rx="18" fill="#ffedd5"/>
    <text x="440" y="155" class="section-title">AWS Cloud / ap-northeast-2</text>

    <g id="public-zone">
      <rect class="subnet-public" x="445" y="198" width="722" height="114"/>
      <text x="468" y="225" class="label">Public Subnet Layer</text>

      <g transform="translate(530 242)">
        <rect class="node" x="0" y="0" width="130" height="46"/>
        <rect x="12" y="9" width="28" height="28" rx="5" class="icon-purple"/>
        <text x="21" y="28" fill="#ffffff" font-size="13" font-weight="700">53</text>
        <text x="50" y="29" class="label">Route 53</text>
      </g>

      <g transform="translate(718 242)">
        <rect class="node" x="0" y="0" width="144" height="46"/>
        <rect x="12" y="9" width="28" height="28" rx="5" class="icon-purple"/>
        <text x="21" y="28" fill="#ffffff" font-size="13" font-weight="700">ACM</text>
        <text x="52" y="29" class="label">TLS Cert</text>
      </g>

      <g transform="translate(928 231)">
        <rect class="node" x="0" y="0" width="160" height="68"/>
        <rect x="14" y="14" width="40" height="40" rx="8" class="icon-purple"/>
        <text x="25" y="40" fill="#ffffff" font-size="13" font-weight="700">ALB</text>
        <text x="66" y="31" class="label">Application</text>
        <text x="66" y="50" class="label">Load Balancer</text>
      </g>
    </g>

    <g id="vpc-zone">
      <rect class="vpc" x="445" y="340" width="722" height="372"/>
      <text x="468" y="368" class="label">VPC 10.20.0.0/16 / Private Subnet Layer</text>

      <g transform="translate(485 400)">
        <rect class="eks" x="0" y="0" width="426" height="266"/>
        <rect x="0" y="0" width="426" height="42" rx="12" fill="#dbeafe"/>
        <rect x="16" y="10" width="24" height="24" rx="5" class="icon-aws"/>
        <text x="52" y="27" class="section-title">Amazon EKS Cluster</text>

        <g transform="translate(30 68)">
          <rect class="node" x="0" y="0" width="130" height="74"/>
          <rect x="14" y="14" width="34" height="34" rx="7" class="icon-blue"/>
          <text x="58" y="31" class="label">Ingress</text>
          <text x="58" y="50" class="small">class: alb</text>
        </g>

        <g transform="translate(190 68)">
          <rect class="node" x="0" y="0" width="108" height="74"/>
          <rect x="14" y="14" width="34" height="34" rx="7" class="icon-blue"/>
          <text x="58" y="31" class="label">Service</text>
          <text x="58" y="50" class="small">port 80</text>
        </g>

        <g transform="translate(316 60)">
          <rect class="service-panel" x="0" y="0" width="84" height="164"/>
          <text x="16" y="27" class="small">Deployment</text>
          <g transform="translate(20 46)">
            <rect x="0" y="0" width="42" height="42" rx="8" class="icon-blue"/>
            <text x="10" y="26" fill="#ffffff" font-size="12" font-weight="700">Pod</text>
          </g>
          <g transform="translate(20 104)">
            <rect x="0" y="0" width="42" height="42" rx="8" class="icon-blue"/>
            <text x="10" y="26" fill="#ffffff" font-size="12" font-weight="700">Pod</text>
          </g>
        </g>

        <g transform="translate(32 190)">
          <rect class="node" x="0" y="0" width="104" height="48"/>
          <text x="18" y="21" class="small">ConfigMap</text>
          <text x="18" y="38" class="tiny">env config</text>
        </g>
        <g transform="translate(154 190)">
          <rect class="node" x="0" y="0" width="92" height="48"/>
          <text x="24" y="21" class="small">Secret</text>
          <text x="14" y="38" class="tiny">passwords</text>
        </g>
        <g transform="translate(264 190)">
          <rect class="node" x="0" y="0" width="92" height="48"/>
          <text x="32" y="21" class="small">HPA</text>
          <text x="12" y="38" class="tiny">2-5 pods</text>
        </g>

        <path class="line" d="M160 105 L190 105"/>
        <path class="line" d="M298 105 L316 105"/>
        <path class="line-soft" d="M310 190 C324 172 342 162 358 152"/>
      </g>

      <g id="observability" transform="translate(948 400)">
        <rect class="obs" x="0" y="0" width="180" height="266"/>
        <text x="22" y="30" class="section-title">Monitoring</text>
        <g transform="translate(26 60)">
          <rect class="node" x="0" y="0" width="126" height="48"/>
          <rect x="12" y="10" width="28" height="28" rx="7" class="icon-pink"/>
          <text x="50" y="30" class="label">Prometheus</text>
        </g>
        <g transform="translate(26 126)">
          <rect class="node" x="0" y="0" width="126" height="48"/>
          <rect x="12" y="10" width="28" height="28" rx="7" class="icon-purple"/>
          <text x="50" y="30" class="label">Grafana</text>
        </g>
        <g transform="translate(26 192)">
          <rect class="node" x="0" y="0" width="126" height="48"/>
          <rect x="12" y="10" width="28" height="28" rx="7" class="icon-aws"/>
          <text x="50" y="30" class="label">CloudWatch</text>
        </g>
      </g>
    </g>
  </g>

  <g id="managed-services" transform="translate(1260 156)">
    <rect class="soft" x="0" y="0" width="286" height="560"/>
    <text x="24" y="34" class="section-title">AWS Managed Services</text>

    <g transform="translate(28 68)">
      <rect class="node" x="0" y="0" width="230" height="74"/>
      <rect x="16" y="16" width="42" height="42" rx="8" class="icon-blue"/>
      <text x="76" y="31" class="label">Amazon RDS</text>
      <text x="76" y="51" class="small">MariaDB / backup 7d</text>
    </g>

    <g transform="translate(28 162)">
      <rect class="node" x="0" y="0" width="230" height="74"/>
      <rect x="16" y="16" width="42" height="42" rx="8" class="icon-pink"/>
      <text x="76" y="31" class="label">ElastiCache Redis</text>
      <text x="76" y="51" class="small">cache / token / SSE</text>
    </g>

    <g transform="translate(28 256)">
      <rect class="node" x="0" y="0" width="230" height="74"/>
      <rect x="16" y="16" width="42" height="42" rx="8" class="icon-pink"/>
      <text x="76" y="31" class="label">Amazon MQ</text>
      <text x="76" y="51" class="small">RabbitMQ / AMQPS 5671</text>
    </g>

    <g transform="translate(28 350)">
      <rect class="node" x="0" y="0" width="230" height="74"/>
      <rect x="16" y="16" width="42" height="42" rx="8" class="icon-green"/>
      <text x="76" y="31" class="label">Amazon S3</text>
      <text x="76" y="51" class="small">product images</text>
    </g>

    <g transform="translate(28 444)">
      <rect class="iac" x="0" y="0" width="230" height="74"/>
      <rect x="16" y="16" width="42" height="42" rx="8" class="icon-green"/>
      <text x="76" y="31" class="label">S3 Remote State</text>
      <text x="76" y="51" class="small">versioning + lockfile</text>
    </g>
  </g>

  <g id="cicd" transform="translate(44 815)">
    <text x="0" y="-18" class="section-title">CI/CD &amp; IaC Automation</text>
    <rect class="soft" x="0" y="0" width="1176" height="114"/>

    <g transform="translate(28 28)">
      <rect class="node" x="0" y="0" width="112" height="58"/>
      <rect x="14" y="13" width="32" height="32" rx="8" class="icon-dark"/>
      <text x="58" y="26" class="label">GitHub</text>
      <text x="58" y="44" class="tiny">FE/BE/Infra</text>
    </g>

    <g transform="translate(184 28)">
      <rect class="node" x="0" y="0" width="126" height="58"/>
      <rect x="14" y="13" width="32" height="32" rx="8" class="icon-gray"/>
      <text x="58" y="26" class="label">Jenkins</text>
      <text x="58" y="44" class="tiny">test/build/deploy</text>
    </g>

    <g transform="translate(356 28)">
      <rect class="node" x="0" y="0" width="112" height="58"/>
      <rect x="14" y="13" width="32" height="32" rx="8" class="icon-blue"/>
      <text x="58" y="26" class="label">Gradle</text>
      <text x="58" y="44" class="tiny">test + bootJar</text>
    </g>

    <g transform="translate(514 28)">
      <rect class="node" x="0" y="0" width="112" height="58"/>
      <rect x="14" y="13" width="32" height="32" rx="8" class="icon-blue"/>
      <text x="58" y="26" class="label">Docker</text>
      <text x="58" y="44" class="tiny">image build</text>
    </g>

    <g transform="translate(672 28)">
      <rect class="node" x="0" y="0" width="112" height="58"/>
      <rect x="14" y="13" width="32" height="32" rx="8" class="icon-aws"/>
      <text x="58" y="26" class="label">ECR</text>
      <text x="58" y="44" class="tiny">image push</text>
    </g>

    <g transform="translate(830 28)">
      <rect class="node" x="0" y="0" width="128" height="58"/>
      <rect x="14" y="13" width="32" height="32" rx="8" class="icon-purple"/>
      <text x="58" y="26" class="label">kubectl</text>
      <text x="58" y="44" class="tiny">apply + rollout</text>
    </g>

    <g transform="translate(1006 28)">
      <rect class="iac" x="0" y="0" width="132" height="58"/>
      <rect x="14" y="13" width="32" height="32" rx="8" class="icon-green"/>
      <text x="58" y="26" class="label">Terraform</text>
      <text x="58" y="44" class="tiny">plan/apply</text>
    </g>

    <path class="line-green" d="M140 57 L184 57"/>
    <path class="line-green" d="M310 57 L356 57"/>
    <path class="line-green" d="M468 57 L514 57"/>
    <path class="line-green" d="M626 57 L672 57"/>
    <path class="line-green" d="M784 57 L830 57"/>
    <path class="line-green" d="M958 57 L1006 57"/>
  </g>

  <g id="metrics" transform="translate(1260 744)">
    <rect class="box" x="0" y="0" width="286" height="158"/>
    <text x="24" y="34" class="section-title">Portfolio Metrics</text>
    <rect class="badge" x="24" y="55" width="238" height="24"/>
    <text x="38" y="72" class="badge-text">배포 자동화: build → push → rollout</text>
    <rect class="badge" x="24" y="88" width="238" height="24"/>
    <text x="38" y="105" class="badge-text">확장성: HPA CPU 70%, Mem 80%</text>
    <rect class="badge" x="24" y="121" width="238" height="24"/>
    <text x="38" y="138" class="badge-text">운영성: logs, metrics, alert 기준화</text>
  </g>

  <path class="line" d="M344 230 C390 230 458 255 530 265"/>
  <path class="line" d="M344 344 C430 344 828 300 928 265"/>
  <path class="line" d="M1088 265 L1260 226"/>
  <path class="line" d="M911 505 L928 265"/>

  <path class="line" d="M911 520 C1040 520 1110 228 1288 224"/>
  <path class="line" d="M911 540 C1035 540 1110 322 1288 318"/>
  <path class="line" d="M911 560 C1030 560 1110 416 1288 412"/>
  <path class="line" d="M911 580 C1025 580 1110 510 1288 506"/>
  <path class="line-soft" d="M875 588 C930 640 976 660 1000 658"/>

  <path class="line-green" d="M874 872 C940 825 955 706 850 658"/>
  <path class="line-green" d="M728 844 C728 785 756 744 810 666"/>
  <path class="line-green" d="M1068 844 C1080 790 1130 730 1288 600"/>

  <path class="line-soft" d="M1106 592 C1160 650 1215 720 1260 796"/>

  <g transform="translate(54 430)">
    <rect class="box" x="0" y="0" width="320" height="146"/>
    <text x="22" y="32" class="section-title">Frontend 선택 이유</text>
    <text x="22" y="62" class="small">Vercel: Preview deploy, rollback,</text>
    <text x="22" y="82" class="small">환경변수 분리, FE 운영 단순화</text>
    <text x="22" y="114" class="small">S3 정적 배포 대신 AWS 역량은</text>
    <text x="22" y="134" class="small">Backend/EKS/Monitoring에 집중</text>
  </g>

  <g transform="translate(54 610)">
    <rect class="box" x="0" y="0" width="320" height="134"/>
    <text x="22" y="32" class="section-title">운영 비교 포인트</text>
    <text x="22" y="62" class="small">수동 배포 대비 Jenkins 자동화 시간</text>
    <text x="22" y="84" class="small">HPA 적용 전/후 처리량과 latency</text>
    <text x="22" y="106" class="small">Redis/RabbitMQ 적용 전/후 병목 감소</text>
  </g>
</svg>
