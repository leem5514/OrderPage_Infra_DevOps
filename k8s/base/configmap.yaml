apiVersion: v1
kind: ConfigMap
metadata:
  name: orderpage-backend-config
  namespace: orderpage
  labels:
    app.kubernetes.io/name: orderpage-backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: orderpage
data:
  DB_URL: jdbc:mariadb://orderpage-mariadb:3306/ordersystem
  DB_POOL_MAX_SIZE: "20"
  DB_POOL_MIN_IDLE: "5"
  DB_POOL_CONNECTION_TIMEOUT: "10000"
  REDIS_HOST: orderpage-redis
  REDIS_PORT: "6379"
  RABBITMQ_HOST: orderpage-rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_VHOST: /
  RABBITMQ_LISTENER_CONCURRENCY: "3"
  RABBITMQ_LISTENER_MAX_CONCURRENCY: "10"
  TOMCAT_THREADS_MAX: "500"
  TOMCAT_THREADS_MIN_SPARE: "20"
  TOMCAT_ACCEPT_COUNT: "500"
  AWS_REGION: ap-northeast-2
  AWS_S3_BUCKET: order-system-bucket
  CORS_ALLOWED_ORIGINS: http://localhost:8081,http://localhost:8092,https://www.dding.shop
