apiVersion: v1
kind: Namespace
metadata:
  name: orderpage
  annotations:
    # 수동 주입 Secret도 있는 namespace 전체를 Git prune으로 삭제하지 않는다.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  labels:
    app.kubernetes.io/name: orderpage
    app.kubernetes.io/part-of: orderpage
    # 새 Pod는 ALB TargetGroup에서도 Healthy가 되어야 Ready로 처리한다.
    elbv2.k8s.aws/pod-readiness-gate-inject: enabled
