apiVersion: v1
kind: Secret
metadata:
  name: orderpage-backend-secret
  namespace: orderpage
  labels:
    app.kubernetes.io/name: orderpage-backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: orderpage
type: Opaque
# 포트폴리오용 placeholder다. 실제 운영 값은 Jenkins credential, External Secrets,
# AWS Secrets Manager 중 하나로 주입하고 Git에는 커밋하지 않는다.
stringData:
  DB_USERNAME: change-me
  DB_PASSWORD: change-me
  JWT_SECRET_KEY: change-me-access-token-secret
  JWT_SECRET_KEY_RT: change-me-refresh-token-secret
  RABBITMQ_USERNAME: orderadmin
  RABBITMQ_PASSWORD: change-me-strong-password
