apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# base는 모든 환경(dev/prod)이 공유하는 공통 Kubernetes 리소스 묶음이다.
# 환경별 차이는 overlays/* 에서 patch로 덮어쓴다.
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - ingress.yaml
