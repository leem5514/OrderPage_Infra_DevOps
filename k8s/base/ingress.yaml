apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orderpage-backend
  namespace: orderpage
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    # HTTP는 HTTPS로 이동한다. 인증서는 같은 서울 리전에서 ISSUED여야 한다.
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: REPLACE_REQUIRED_ACM_ARN
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health/readiness
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
    alb.ingress.kubernetes.io/success-codes: "200"
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=30
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=300
    # 공개 인터넷에는 Actuator를 노출하지 않는다. ALB probe는 Pod로 직접 접근한다.
    alb.ingress.kubernetes.io/actions.deny-actuator: '{"type":"fixed-response","fixedResponseConfig":{"contentType":"text/plain","statusCode":"404","messageBody":"Not found"}}'
spec:
  ingressClassName: alb
  rules:
    - host: api-devops.auctionbid.shop
      http:
        paths:
          - path: /actuator
            pathType: Prefix
            backend:
              service:
                name: deny-actuator
                port:
                  name: use-annotation
          - path: /
            pathType: Prefix
            backend:
              service:
                name: orderpage-backend
                port:
                  name: http
