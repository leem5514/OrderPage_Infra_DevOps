apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orderpage-backend
  namespace: orderpage
  labels:
    app.kubernetes.io/name: orderpage-backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: orderpage
  annotations:
    # AWS Load Balancer Controller가 이 Ingress를 보고 ALB를 생성한다.
    kubernetes.io/ingress.class: alb
    # internet-facing은 외부 사용자가 접근 가능한 ALB를 만든다.
    alb.ingress.kubernetes.io/scheme: internet-facing
    # target-type ip는 ALB가 Service NodePort가 아니라 Pod IP로 직접 라우팅하게 한다.
    alb.ingress.kubernetes.io/target-type: ip
    # ALB target health check 경로. Spring Actuator health endpoint와 맞춘다.
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
spec:
  rules:
    - host: api.dev.orderpage.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: orderpage-backend
                port:
                  name: http
