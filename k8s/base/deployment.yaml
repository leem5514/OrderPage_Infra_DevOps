apiVersion: apps/v1
kind: Deployment
metadata:
  name: orderpage-backend
  namespace: orderpage
  labels:
    app.kubernetes.io/name: orderpage-backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: orderpage
spec:
  # 기본은 2개 고정이다. HPA는 별도 비교 overlay에서만 사용한다.
  replicas: 2
  revisionHistoryLimit: 3

  # RollingUpdate는 새 버전을 띄운 뒤 기존 Pod를 내리는 배포 방식이다.
  # maxUnavailable 0은 배포 중 사용 가능한 Pod 수가 줄어들지 않게 하는 설정이다.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: orderpage-backend
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orderpage-backend
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: orderpage
    spec:
      serviceAccountName: orderpage-backend
      # 앱은 Kubernetes API 토큰이 필요 없다. IRSA 토큰은 EKS webhook이 별도로 주입한다.
      automountServiceAccountToken: false
      volumes:
        - name: rds-ca
          configMap:
            name: orderpage-rds-ca
      # preStop 5s도 이 60s에 포함된다. Spring 단계별 20s와 자원 정리에 여유를 둔다.
      terminationGracePeriodSeconds: 60
      containers:
        - name: orderpage-backend
          # 현재는 placeholder. CI/CD 연결 단계에서 실제 ECR digest를 Infra Git에 기록하고 Argo CD로 동기화한다.
          image: REPLACE_REQUIRED_IMAGE
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: rds-ca
              mountPath: /etc/rds-ca
              readOnly: true
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            # ConfigMap은 endpoint, pool size처럼 공개되어도 되는 환경 설정을 담는다.
            - configMapRef:
                name: orderpage-backend-config
          # 필수 Secret key가 하나라도 없으면 Pod 시작을 막아 공개 개발용 기본값 사용을 방지한다.
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef: { name: orderpage-backend-secret, key: DB_USERNAME }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: orderpage-backend-secret, key: DB_PASSWORD }
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: orderpage-backend-secret, key: REDIS_PASSWORD }
            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef: { name: orderpage-backend-secret, key: RABBITMQ_USERNAME }
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef: { name: orderpage-backend-secret, key: RABBITMQ_PASSWORD }
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: orderpage-backend-secret, key: JWT_SECRET_KEY }
            - name: JWT_SECRET_KEY_RT
              valueFrom:
                secretKeyRef: { name: orderpage-backend-secret, key: JWT_SECRET_KEY_RT }

          lifecycle:
            preStop:
              exec:
                # 라우팅 대상 제외가 전파될 짧은 여유. 실제 ALB 전파시간은 배포 후 측정한다.
                command: ["/bin/sh", "-c", "sleep 5"]

          # 최초 기동에 최대 약 120s를 준다. 성공 전에는 readiness/liveness를 실행하지 않는다.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24

          # 준비 상태 + DB 연결. 실패하면 Service 트래픽 대상에서 제외한다.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          # 앱 자체 상태만 확인한다. DB 장애만으로 전체 Pod를 재시작하지 않는다.
          # 이 상태 지표가 모든 종류의 deadlock을 자동 감지하는 것은 아니다.
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          # requests는 스케줄링과 HPA 계산 기준, limits는 컨테이너 최대 사용량 제한이다.
          # HPA의 CPU/memory Utilization은 requests 대비 사용률로 계산된다.
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
