# Chart 3.6.2 / Controller v3.6.2. prepare-deployment가 계정별 값을 채운다.
clusterName: REPLACE_REQUIRED_CLUSTER
region: ap-northeast-2
vpcId: REPLACE_REQUIRED_VPC
serviceAccount:
  create: true
  name: aws-load-balancer-controller
  annotations:
    eks.amazonaws.com/role-arn: REPLACE_REQUIRED_CONTROLLER_ROLE
replicaCount: 2
ingressClass: alb
enableServiceMutatorWebhook: false
enablePodReadinessGateInject: true
enableWaf: false
enableWafv2: false
enableShield: false
controllerConfig:
  featureGates:
    ALBGatewayAPI: false
    NLBGatewayAPI: false
# 게이트/리스너 실험은 사용하지 않는다. 단일 ALB Ingress 흐름만 구성한다.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi
