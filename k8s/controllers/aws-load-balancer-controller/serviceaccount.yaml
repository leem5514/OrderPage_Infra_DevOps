apiVersion: v1
kind: ServiceAccount
metadata:
  name: aws-load-balancer-controller
  namespace: kube-system
  labels:
    app.kubernetes.io/name: aws-load-balancer-controller
    app.kubernetes.io/part-of: orderpage
  annotations:
    # 후속 Controller IRSA Role 연결 후 그 ARN으로 교체한다. 현재 root에는 이 Role 출력이 없다.
    eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/orderpage-dev-aws-load-balancer-controller
