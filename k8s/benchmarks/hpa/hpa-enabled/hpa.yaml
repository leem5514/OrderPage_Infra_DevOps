apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: orderpage-backend
  namespace: orderpage
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: orderpage-backend
  # 기본 배포에는 없으며 metrics-server와 자원 예산을 검증한 뒤 실험에서만 사용한다.
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
